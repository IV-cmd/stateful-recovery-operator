apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: recoverypolicies.recovery.iv-cmd.dev
spec:
  group: recovery.iv-cmd.dev
  scope: Namespaced
  names:
    kind: RecoveryPolicy
    plural: recoverypolicies
    singular: recoverypolicy
    shortNames: [rp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.targetRef.name
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Last Backup
          type: date
          jsonPath: .status.lastBackupTime
        - name: Last Recovery
          type: date
          jsonPath: .status.recovery.lastActionTime
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetRef]
              properties:
                targetRef:
                  description: The StatefulSet in the same namespace that this policy protects.
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                backup:
                  type: object
                  properties:
                    schedule:
                      description: Cron schedule for VolumeSnapshot backups.
                      type: string
                    retention:
                      description: Number of snapshots to keep per PVC.
                      type: integer
                      minimum: 1
                recovery:
                  type: object
                  # default {} so the dryRun default applies even when recovery is omitted.
                  default: {}
                  properties:
                    maxConcurrentRecoveries:
                      type: integer
                      minimum: 1
                      default: 1
                    maxRestarts:
                      description: Consecutive restarts before the operator gives up and sets phase Failed.
                      type: integer
                      minimum: 0
                      default: 3
                    unreadySeconds:
                      description: How long a pod must stay unready before a restart.
                      type: integer
                      minimum: 1
                      default: 120
                    fencing:
                      type: object
                      # default {} so the field defaults apply even when fencing is omitted.
                      default: {}
                      properties:
                        enabled:
                          description: Fence dead nodes with the out-of-service taint.
                          type: boolean
                          default: false
                        notReadySeconds:
                          description: How long a node must stay NotReady before fencing.
                          type: integer
                          minimum: 60
                          default: 120
                        verifySeconds:
                          description: How long to wait for pods and VolumeAttachments to clear before warning.
                          type: integer
                          default: 180
                    restore:
                      type: object
                      # default {} so the field defaults apply even when restore is omitted.
                      default: {}
                      properties:
                        enabled:
                          description: Restore the PVC from the newest good snapshot when restarts run out.
                          type: boolean
                          default: false
                        bindTimeoutSeconds:
                          description: How long to wait for a restore PVC to bind before giving up.
                          type: integer
                          minimum: 30
                          default: 180
                        readyTimeoutSeconds:
                          description: How long to wait for the restored pod to become Ready before giving up.
                          type: integer
                          minimum: 60
                          default: 300
                    dryRun:
                      description: Log recovery actions without executing them.
                      type: boolean
                      default: true
            status:
              type: object
              # Kopf stores handler results and progress here; without this the API server prunes them silently.
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                lastBackupTime:
                  type: string
                  format: date-time
