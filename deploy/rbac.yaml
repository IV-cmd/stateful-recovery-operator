# Cluster scope: nodes and VolumeAttachments are cluster-scoped objects, so a
# namespaced Role cannot grant access to them. A namespaced Role for the pod
# and snapshot work comes in M7.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recovery-operator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: recovery-operator-fencing
rules:
  - apiGroups: [""]
    resources: [nodes]
    # taints live in spec.taints, so plain patch is enough; nodes/status is
    # not needed because we only read conditions
    verbs: [get, list, watch, patch]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumes]
    # needed to map a PV to the PVC that a VolumeAttachment carries
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: recovery-operator-fencing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: recovery-operator-fencing
subjects:
  - kind: ServiceAccount
    name: recovery-operator
    namespace: default
